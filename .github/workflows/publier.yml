# À chaque push sur main : on vérifie les skills (format, charte, versions, rendus Python, site),
# puis on construit le site (catalogue, téléchargements) et on le publie sur GitHub Pages.
# Le site n'est publié que si tout passe.
# La charte se lit dans le dépôt privé gharel/design-skazy, que chaque job clone : le secret
# DESIGN_SKAZY_TOKEN est un jeton d'accès en lecture seule au contenu de ce dépôt.
name: Vérifier puis publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Tests (skills, rendus, site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Récupérer design-skazy, source de la charte (dépôt privé)
        shell: bash
        env:
          JETON: ${{ secrets.DESIGN_SKAZY_TOKEN }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${JETON}@github.com/gharel/design-skazy.git" "$RUNNER_TEMP/design-skazy"
          echo "DESIGN_SKAZY=$RUNNER_TEMP/design-skazy" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer les outils
        run: |
          npm ci
          python -m pip install --quiet python-docx python-pptx openpyxl pillow pytest
      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium
      - name: Format, skills conformes, code commun, alignement des modèles et versions montées
        run: npm run check
        env:
          BASE: ${{ github.event.before }}
      - name: Tests des outils (Vitest)
        run: npm test
      - name: Tests des rendus (plan, support, quiz)
        run: npm run test:py
      - name: Construire le site
        run: npm run construire
      - name: Tests du site (Playwright)
        run: npm run test:e2e
      - name: Garder le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  # Les installeurs sur les trois systèmes : installer.sh (Ubuntu, macOS), installer.ps1 sous
  # PowerShell 5.1 (Windows) et 7 (partout). WSL ne tourne pas ici : vérification à la main.
  installeurs:
    name: Installeurs (${{ matrix.systeme }})
    strategy:
      fail-fast: false
      matrix:
        systeme: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.systeme }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Récupérer design-skazy, source de la charte (dépôt privé)
        shell: bash
        env:
          JETON: ${{ secrets.DESIGN_SKAZY_TOKEN }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${JETON}@github.com/gharel/design-skazy.git" "$RUNNER_TEMP/design-skazy"
          echo "DESIGN_SKAZY=$RUNNER_TEMP/design-skazy" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: npm run construire
      - name: Tests des installeurs
        run: npm run test:installeurs

  publier:
    name: Publication sur GitHub Pages
    needs: [verifier, installeurs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Récupérer design-skazy, source de la charte (dépôt privé)
        shell: bash
        env:
          JETON: ${{ secrets.DESIGN_SKAZY_TOKEN }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${JETON}@github.com/gharel/design-skazy.git" "$RUNNER_TEMP/design-skazy"
          echo "DESIGN_SKAZY=$RUNNER_TEMP/design-skazy" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: npm run construire
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5
